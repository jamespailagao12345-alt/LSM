<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
    margin: 0;
    padding: 0;
}
.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
h1, h2 {
    text-align: center;
    color: #b30059;
}
textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
button {
    background: #ff4d6d;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}
button:hover {
    background: #e63950;
}
img {
    max-width: 100%;
    border-radius: 12px;
    display: block;
    margin: auto;
}
audio {
    width: 100%;
    margin-top: 10px;
}
#viewer {
    display: none;
}
.footer {
    text-align: center;
    font-size: 14px;
    color: #666;
}
</style>
</head>
<body>

<div class="container">

<!-- CREATOR MODE -->
<div class="card" id="creator">
    <h1>Create Sweet Message ❤️</h1>

    <label>💌 Long Sweet Message</label>
    <textarea id="message" rows="6"></textarea>

    <label>🖼️ Upload Picture</label>
    <input type="file" id="image" accept="image/*">

    <label>🎶 Upload Favorite Song</label>
    <input type="file" id="song" accept="audio/*">

    <button onclick="generateLink()">Generate Viewer Link</button>

    <p><strong>Generated Link:</strong></p>
    <input type="text" id="linkOutput" readonly>
</div>

<!-- VIEWER MODE -->
<div id="viewer">
    <div class="card">
        <h1>For You ❤️</h1>
        <img id="viewImage">
    </div>

    <div class="card">
        <h2>My Message 💌</h2>
        <p id="viewMessage"></p>
    </div>

    <div class="card">
        <h2>Our Song 🎶</h2>
        <audio id="viewSong" controls></audio>
        <p style="text-align:center;font-size:14px;">
            Press ▶️ and listen with love ❤️
        </p>
    </div>

    <div class="footer">
        Made with ❤️ just for you
    </div>
</div>

</div>

<script>
function generateLink() {
    const message = encodeURIComponent(
        document.getElementById("message").value
    );
    const imgFile = document.getElementById("image").files[0];
    const songFile = document.getElementById("song").files[0];

    if (!message || !imgFile || !songFile) {
        alert("Please complete all fields ❤️");
        return;
    }

    const imgReader = new FileReader();
    const songReader = new FileReader();

    imgReader.onload = () => {
        songReader.onload = () => {
            const imgData = encodeURIComponent(imgReader.result);
            const songData = encodeURIComponent(songReader.result);

            const link =
                location.origin +
                location.pathname +
                "?view=1&msg=" +
                message +
                "&img=" +
                imgData +
                "&song=" +
                songData;

            document.getElementById("linkOutput").value = link;
        };
        songReader.readAsDataURL(songFile);
    };
    imgReader.readAsDataURL(imgFile);
}

// VIEWER MODE
const params = new URLSearchParams(window.location.search);
if (params.get("view") === "1") {
    document.getElementById("creator").style.display = "none";
    document.getElementById("viewer").style.display = "block";

    document.getElementById("viewMessage").innerText =
        decodeURIComponent(params.get("msg"));

    document.getElementById("viewImage").src =
        decodeURIComponent(params.get("img"));

    document.getElementById("viewSong").src =
        decodeURIComponent(params.get("song"));

    // Play after first click (browser safe)
    document.body.addEventListener("click", () => {
        const song = document.getElementById("viewSong");
        if (song.paused) song.play().catch(() => {});
    }, { once: true });
}
</script>

</body>
</html>
