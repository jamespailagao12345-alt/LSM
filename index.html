<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom, #ffdde1, #ee9ca7);
    margin: 0;
    padding: 0;
}
.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
h1, h2 {
    text-align: center;
    color: #b30059;
}
textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
button {
    background: #ff4d6d;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}
img {
    max-width: 100%;
    border-radius: 12px;
    display: block;
    margin: auto;
}
audio {
    width: 100%;
}
#viewer { display: none; }
</style>
</head>
<body>

<div class="container">

<!-- CREATOR -->
<div class="card" id="creator">
    <h1>Create Sweet Message ❤️</h1>

    <textarea id="message" rows="5" placeholder="Write your sweet message..."></textarea>
    <input type="file" id="image" accept="image/*">
    <input type="file" id="song" accept="audio/*">

    <button onclick="saveContent()">Save & Generate Link</button>

    <p><strong>Viewer Link:</strong></p>
    <input type="text" value="?view=1" readonly>
</div>

<!-- VIEWER -->
<div id="viewer">
    <div class="card">
        <h1>For You ❤️</h1>
        <img id="viewImage">
    </div>

    <div class="card">
        <h2>My Message 💌</h2>
        <p id="viewMessage"></p>
    </div>

    <div class="card">
        <h2>Our Song 🎶</h2>
        <audio id="viewSong" controls></audio>
        <p style="text-align:center;font-size:14px;">Press ▶️ and feel the love ❤️</p>
    </div>
</div>

</div>

<script>
function saveContent() {
    const msg = document.getElementById("message").value;
    const img = document.getElementById("image").files[0];
    const song = document.getElementById("song").files[0];

    if (!msg || !img || !song) {
        alert("Complete everything ❤️");
        return;
    }

    localStorage.setItem("message", msg);

    const imgReader = new FileReader();
    imgReader.onload = () => localStorage.setItem("image", imgReader.result);
    imgReader.readAsDataURL(img);

    const songReader = new FileReader();
    songReader.onload = () => localStorage.setItem("song", songReader.result);
    songReader.readAsDataURL(song);

    alert("Saved! Send this link: ?view=1 ❤️");
}

// VIEW MODE
if (new URLSearchParams(location.search).get("view") === "1") {
    document.getElementById("creator").style.display = "none";
    document.getElementById("viewer").style.display = "block";

    document.getElementById("viewMessage").innerText = localStorage.getItem("message");
    document.getElementById("viewImage").src = localStorage.getItem("image");
    document.getElementById("viewSong").src = localStorage.getItem("song");

    document.body.addEventListener("click", () => {
        const song = document.getElementById("viewSong");
        if (song.paused) song.play().catch(()=>{});
    }, { once:true });
}
</script>

</body>
</html>
